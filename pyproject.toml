[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonweaver"
version = "0.3.0"
description = "Turn agent traces into reviewed, reusable operational lessons."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "lessonweaver contributors" }]
keywords = [
  "agents",
  "ai",
  "traces",
  "skills",
  "governance",
  "agents.md",
  "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dgenio/lessonweaver"
Repository = "https://github.com/dgenio/lessonweaver"
Issues = "https://github.com/dgenio/lessonweaver/issues"
Changelog = "https://github.com/dgenio/lessonweaver/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.0",
  "twine>=6.1",
]

[project.scripts]
lessonweaver = "lessonweaver.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lessonweaver = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
