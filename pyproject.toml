[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonweaver"
version = "0.4.1"
description = "Turn agent traces into reviewed, reusable operational lessons."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "lessonweaver contributors" }]
keywords = [
  "agents",
  "ai",
  "traces",
  "skills",
  "governance",
  "agents.md",
  "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dgenio/lessonweaver"
Repository = "https://github.com/dgenio/lessonweaver"
Issues = "https://github.com/dgenio/lessonweaver/issues"
Changelog = "https://github.com/dgenio/lessonweaver/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = [
  # >=1.10: the low-level server first supported returning a plain dict as
  # tool `structuredContent` (MCP spec revision 2025-06-18); the binding in
  # mcp_server.py relies on that, so earlier releases would fail at call time.
  # MCP 2.x changes the Tool/server API used by this binding; migration is #375.
  "mcp>=1.10,<2",
]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.0",
  "twine>=6.1",
  # Installed in dev so CI exercises the optional MCP server binding; the base
  # install and `import lessonweaver` stay dependency-free.
  "mcp>=1.10,<2",
]

[project.scripts]
lessonweaver = "lessonweaver.cli:main"
lessonweaver-mcp = "lessonweaver.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lessonweaver = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF", "PT"]
ignore = [
  # CLI help text and user-facing messages are easier to audit with explicit strings.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

# The MCP SDK is an optional, lazily-imported integration (see mcp_server.py)
# and does not ship mypy-checkable stubs; treat its imports as untyped.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
