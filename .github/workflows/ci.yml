name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Type check
        run: mypy src/lessonweaver/
      - name: Run tests
        run: pytest
      - name: Generate determinism digest
        run: python scripts/determinism_digest.py --output determinism-${{ matrix.python-version }}.json
      - name: Upload determinism digest
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.python-version }}
          path: determinism-${{ matrix.python-version }}.json

  determinism-compare:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: determinism-artifacts
      - name: Compare matrix determinism digests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          documents = []
          for path in sorted(Path("determinism-artifacts").glob("*/determinism-*.json")):
              documents.append((str(path), json.loads(path.read_text())))
          if not documents:
              raise SystemExit("no determinism digest artifacts found")

          expected = documents[0][1]["digest"]
          mismatches = [
              f"{path}: {document['digest']}"
              for path, document in documents
              if document["digest"] != expected
          ]
          if mismatches:
              raise SystemExit(
                  "determinism digests differ across matrix legs:\n" + "\n".join(mismatches)
              )
          print(f"determinism digest {expected} matched across {len(documents)} matrix legs")
          PY
