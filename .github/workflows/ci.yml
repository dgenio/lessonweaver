name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Type check
        run: mypy src/lessonweaver/
      - name: Run tests
        run: pytest
      - name: Guard detection benchmark
        run: lessonweaver eval-detection benchmark/v1/corpus.json --compare-results benchmark/v1/results.json

  mcp-compatibility:
    name: MCP v1 ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [floor, latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install MCP compatibility edge
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.resolution }}" = "floor" ]; then
            python -m pip install uv
            uv pip install --system --resolution lowest-direct -e ".[mcp]" pytest
          else
            python -m pip install --upgrade -e ".[mcp]" pytest
          fi
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Run MCP-aware suite
        run: pytest -q
