name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Type check
        run: mypy src/lessonweaver/
      - name: Run tests
        run: pytest

  dependency-policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: floor
            python-version: "3.10"
            prerelease: "false"
          - name: prerelease
            python-version: "3.14"
            prerelease: "true"
    continue-on-error: ${{ matrix.name == 'prerelease' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.prerelease }}
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install package with minimum direct dependencies
        if: matrix.name == 'floor'
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[dev]"
      - name: Install package with latest pre-release dependencies
        if: matrix.name == 'prerelease'
        run: |
          uv venv
          uv pip install --upgrade --prerelease allow -e ".[dev]"
      - name: Run tests
        run: .venv/bin/python -m pytest
