name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package, MCP integration and maintainer tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]" --group dev
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Type check
        run: mypy src/lessonweaver/
      - name: Run tests
        run: pytest
      - name: Guard detection benchmark
        run: lessonweaver eval-detection benchmark/v1/corpus.json --compare-results benchmark/v1/results.json

  mcp-compatibility:
    name: MCP v1 ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [floor, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install MCP compatibility edge
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.resolution }}" = "floor" ]; then
            python -m pip install uv
            # pytest is the harness, not part of the published MCP extra. Give
            # it its own supported floor while resolving mcp to the declared
            # minimum via lowest-direct.
            uv pip install --system --resolution lowest-direct -e ".[mcp]" "pytest>=8"
          else
            python -m pip install --upgrade -e ".[mcp]" "pytest>=8"
          fi
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Run MCP-aware suite
        run: pytest -q
