name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require changelog for source changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          if [ "$NO_CHANGELOG" = "true" ]; then
            echo "Skipping changelog gate because the PR has the no-changelog label."
            exit 0
          fi
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\n' "$changed_files" | grep -q '^src/'; then
            if ! printf '%s\n' "$changed_files" | grep -qx 'CHANGELOG.md'; then
              echo "PRs touching src/ must update CHANGELOG.md or carry the no-changelog label."
              exit 1
            fi
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Type check
        run: mypy src/lessonweaver/
      - name: Run tests
        run: pytest
