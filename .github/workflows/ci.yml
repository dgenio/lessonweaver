name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            quality_gates: true
          - os: ubuntu-latest
            python-version: "3.11"
            quality_gates: false
          - os: ubuntu-latest
            python-version: "3.12"
            quality_gates: false
          - os: macos-latest
            python-version: "3.12"
            quality_gates: false
          - os: windows-latest
            python-version: "3.12"
            quality_gates: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint
        if: matrix.quality_gates
        run: ruff check src/ tests/
      - name: Format check
        if: matrix.quality_gates
        run: ruff format --check src/ tests/
      - name: Type check
        if: matrix.quality_gates
        run: mypy src/lessonweaver/
      - name: Run tests
        run: pytest --cov=lessonweaver --cov-report=term-missing --cov-report=xml --cov-fail-under=95
